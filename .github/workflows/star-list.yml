name: Check star list for missing mods

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: star-list
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-star-list.js
        env:
          STAR_LIST_TOKEN: ${{ secrets.STAR_LIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
