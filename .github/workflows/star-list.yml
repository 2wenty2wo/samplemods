name: Draft entries from the star list

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: star-list
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate draft entries and open pull requests
        # The script runs npm test per candidate; failures still get a draft PR.
        run: node scripts/check-star-list.js
        env:
          STAR_LIST_TOKEN: ${{ secrets.STAR_LIST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
