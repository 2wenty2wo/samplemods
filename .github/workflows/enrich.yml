name: Refresh GitHub metadata

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/enrich.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENRICH_404_PATH: ${{ runner.temp }}/enrich-404.json
      - run: node scripts/watch.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - run: npm test
      - name: Commit refreshed metadata
        id: commit
        run: |
          git add data/github.json data/readme/ data/contributors.json data/watch.json
          if [ -f data/compat.json ]; then
            git add data/compat.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh GitHub metadata'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed catalog
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync 404 repo tracking issue
        continue-on-error: true
        run: node scripts/enrich-404-issue.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ENRICH_404_PATH: ${{ runner.temp }}/enrich-404.json
      - name: Propose catalog status changes
        run: node scripts/suggest-status.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
