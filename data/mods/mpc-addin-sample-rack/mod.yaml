name: MPC Sample Rack
description: >-
  An add-in that adds a RACK page for adding, removing and switching off the insert plugins in a
  project. Open it with a long hold of PAD FX.
repo: jacob-sabella/mpc-addin-sample-rack
author: jacob-sabella
requires:
  - draw-handler
runs_on:
  - device
install: ssh
firmware: 1.3.0.12, 1.4.0.8 (v1.1.0+)
audience:
  - musician
