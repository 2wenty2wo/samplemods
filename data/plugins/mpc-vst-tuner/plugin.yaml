name: Tuner VST
description: >-
  A chromatic tuner insert that draws its needle on the MPC screen. On the MPC Sample it loads as a
  Rack insert from the aarch64 build.
repo: jacob-sabella/mpc-vst-tuner
author: jacob-sabella
tags:
  - vst
  - tuner
  - utility
install: sd-card
firmware: 1.3.0.12, 1.4 # tuner-vst-v1.1.4 release notes — "MPC Sample 1.4 Knob FX knobs: the Sample's knobs now control Ref and Mute"
runs_on: [device]
audience: [musician]
price: free
source: open
