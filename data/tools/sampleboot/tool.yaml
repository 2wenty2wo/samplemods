name: SampleBoot
description: >-
  A boot selector for the MPC Sample. Keep the stock firmware and any number of custom OSes on one
  SD card, then pick which one starts with the encoder at power-on.
repo: pxcm/SampleBoot
author: pxcm
website: https://sampleboot.com/
tags:
  - boot-menu
  - launcher
install: sd-card
firmware: 1.3.0.12
runs_on: [device]
audience: [musician, player, developer]
# From https://sampleboot.com/ #works-with table (stock firmware skipped).
# Versions tested: SampQOL OS 0.1.4.7–0.3.0, Melodee 0.1.0–0.3.0, MPC Simple 1.0 Beta 1–Beta 3, MPCTRACKER 0.1.0.
# ODDFORM 1.2.0 beta (user report) skipped — no catalog entry.
compatible:
  - sampqol-os
  - melodee-sample
  - mpc-simple
  - mpc-sample-tracker
  # User report per sampleboot.com (Nov 2026): Rhythmer OS 0.2.0.
  - rhythmer-os
  - console-mpc
compatible_versions:
  # Maker-reported SampleBoot startup fix: https://github.com/briwil/console-mpc/releases/tag/v0.0.27
  console-mpc: 0.0.27 or later
watch_pages:
  - https://sampleboot.com/#works-with
