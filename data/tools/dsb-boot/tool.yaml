name: HenrySkillz D.S.B Boot
description: >-
  A boot menu for the MPC Sample. Keep Stock, stock with three HS effects, and other installed
  systems on one SD card, then choose a setup with the encoder at startup.
repo: Holla-Back-Entertainment/henryskillz-mpc-sample-mod-kit
release_prefix: dsb-boot-
author: Henry Skillz
author_url: https://www.henryskillz.com/
website: https://www.henryskillz.com/dsb-guide
price: free
tags:
  - boot-menu
  - launcher
install: sd-card
firmware: 1.3.0.12
runs_on: [device]
audience: [musician, player, developer]
# From https://www.henryskillz.com/dsb-guide#boot (Any OS section).
# Hardware tested 18 Nov 2026 on firmware 1.3.0.12; menu images are emulator captures.
compatible:
  - henryskillz-mod-kit # same author; boots a SampQOL card with D.S.B installed
  - sampqol-os
  - mpc-simple
  - melodee-sample
