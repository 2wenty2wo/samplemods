repo: hdslave/hdslaveOS
author: hdslave
status: experimental
based_on: [melodee-sample]
tags:
  - groovebox
  - sequencer
  - vst
install: sd-card
firmware: 1.3.0.12
runs_on: [device]
audience: [musician]
