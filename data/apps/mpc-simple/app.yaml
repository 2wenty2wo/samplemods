name: MPC Simple
description: >-
  A from-scratch operating system for the MPC Sample that brings back the classic MPC workflow:
  programs, a shared sample pool and MPC2000XL-style sequence editing, plus stem separation and
  CLAP plugins. Runs from the SD card.
