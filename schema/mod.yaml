$schema: https://json-schema.org/draft/2020-12/schema
$title: MPC Sample catalog entry
type: object
additionalProperties: false
required:
  - name
  - description
  - section
  - author
properties:
  name:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  repo:
    type: string
    pattern: ^[^/\s]+/[^/\s]+$
    description: GitHub repository as owner/name
  release_prefix:
    type: string
    minLength: 1
    description: >-
      Only releases whose tag starts with this prefix belong to this entry; for repos that ship
      more than one product
  section:
    type: string
    enum:
      - mods
      - apps
      - plugins
      - games
      - tools
      - guides
      - dev
  author:
    type: string
    minLength: 1
  author_url:
    type: string
    pattern: ^https?://
  price:
    type: string
    enum: [free, paid, pay-what-you-want]
    default: free
  price_note:
    type: string
    minLength: 1
    maxLength: 160
  source:
    type: string
    enum: [open, closed]
    description: Defaults to open with a GitHub repo, otherwise closed
  tags:
    type: array
    items:
      type: string
  requires:
    type: array
    items:
      type: string
      description: Entry ids (kebab-case directory names, across all sections)
  hosts:
    type: array
    minItems: 1
    items:
      type: string
      description: >-
        Catalog entry ids of host apps this plugin runs in (any one is enough); required for
        plugins
  based_on:
    type: array
    items:
      type: string
      description: >-
        Entry ids this project was forked or built from; it runs instead of them, unlike requires
  compatible:
    type: array
    items:
      type: string
      description: Entry ids confirmed to work with this launcher (kebab-case directory names)
  compatible_versions:
    type: object
    description: Manual version labels keyed by entry id from compatible
    additionalProperties:
      type: string
      pattern: '\S'
  firmware:
    type: string
    description: Tested MPC Sample firmware version
  firmware_ignore:
    type: array
    uniqueItems: true
    description: Firmware builds mentioned upstream that should not be flagged for review
    items:
      type: string
      pattern: '^1\.[3-9]\.\d+\.\d+$'
  install:
    type: string
    enum:
      - sd-card
      - boot-thingy
      - web-installer
      - ssh
      - desktop
      - usb-midi
      - none
  runs_on:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [device, desktop, browser, docs]
  audience:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [musician, player, developer, curious]
  website:
    type: string
    pattern: ^https?://
  watch:
    type: string
    pattern: ^https?://
    description: Upstream URL polled for release changes (RSS/Atom/JSON preferred)
  watch_version:
    type: string
    minLength: 1
    description: Version capture pattern for the newest watched feed item
  watch_pages:
    type: array
    uniqueItems: true
    minItems: 1
    items:
      type: string
      pattern: ^https?://
    description: >-
      HTML page URLs polled for section text changes. A #fragment fingerprints only that
      element id's visible text; without a fragment, the whole page text is used.
  version:
    type: string
    minLength: 1
    description: Hand-maintained version for entries without a GitHub repository
  released:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: Hand-maintained release date (YYYY-MM-DD, quote in YAML)
  status:
    type: string
    enum:
      - stable
      - beta
      - experimental
      - archived
      - removed
      - concept
