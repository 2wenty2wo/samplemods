$schema: https://json-schema.org/draft/2020-12/schema
$title: MPC Sample mod
type: object
additionalProperties: false
required:
  - name
  - description
  - repo
  - category
  - author
properties:
  name:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  repo:
    type: string
    pattern: ^[^/\s]+/[^/\s]+$
    description: GitHub repository as owner/name
  category:
    type: string
    enum:
      - os-mod
      - addon
      - app
      - game
      - dev-tool
      - guide
      - external-tool
  author:
    type: string
    minLength: 1
  tags:
    type: array
    items:
      type: string
  requires:
    type: array
    items:
      type: string
      description: Mod ids (kebab-case filenames without .yaml)
  firmware:
    type: string
    description: Tested MPC Sample firmware version
  install:
    type: string
    enum:
      - sd-card
      - web-installer
      - usb-midi
      - none
  website:
    type: string
    pattern: ^https?://
  status:
    type: string
    enum:
      - stable
      - beta
      - experimental
      - archived
