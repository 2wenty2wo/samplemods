$schema: https://json-schema.org/draft/2020-12/schema
$title: MPC Sample catalog entry
type: object
additionalProperties: false
required:
  - name
  - description
  - section
  - author
properties:
  name:
    type: string
    minLength: 1
  description:
    type: string
    minLength: 1
  repo:
    type: string
    pattern: ^[^/\s]+/[^/\s]+$
    description: GitHub repository as owner/name
  section:
    type: string
    enum:
      - mods
      - apps
      - games
      - tools
      - guides
      - dev
  author:
    type: string
    minLength: 1
  author_url:
    type: string
    pattern: ^https?://
  price:
    type: string
    enum: [free, paid, pay-what-you-want]
    default: free
  price_note:
    type: string
    minLength: 1
    maxLength: 160
  source:
    type: string
    enum: [open, closed]
    description: Defaults to open with a GitHub repo, otherwise closed
  tags:
    type: array
    items:
      type: string
  requires:
    type: array
    items:
      type: string
      description: Entry ids (kebab-case directory names, across all sections)
  firmware:
    type: string
    description: Tested MPC Sample firmware version
  install:
    type: string
    enum:
      - sd-card
      - boot-thingy
      - web-installer
      - ssh
      - desktop
      - usb-midi
      - none
  runs_on:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [device, desktop, browser, docs]
  audience:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
      enum: [musician, player, developer, curious]
  website:
    type: string
    pattern: ^https?://
  status:
    type: string
    enum:
      - stable
      - beta
      - experimental
      - archived
      - concept
